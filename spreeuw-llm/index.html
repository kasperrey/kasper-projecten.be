<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreeuw - Gradio Chat</title>
    <link rel="stylesheet" href="spreeuw-llm/chat.css">
    <style>
        /* Verwijdert de standaard marges en zorgt dat de pagina de volledige browserhoogte vult */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Voorkomt ongewenste dubbele scrollbalken */
        }

        /* Zorgt ervoor dat de iframe de volledige ruimte strak inneemt */
        iframe {
            display: block; /* Verwijdert de standaard inline witruimte aan de onderkant */
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
