<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreeuw - Gradio Chat</title>
    <link rel="stylesheet" href="chat.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-new-chat">
                    <i data-lucide="plus"></i> New Chat
                </button>
            </div>
            <nav class="sidebar-history">
                <div class="history-group">Recent Chats</div>
                <a href="#" class="history-item active">
                    <i data-lucide="message-square"></i>
                    <span>Spreeuw LLM Chat</span>
                </a>
            </nav>
        </aside>

        <main class="chat-container">
            <header class="chat-header">
                <button class="btn-icon" id="toggle-sidebar">
                    <i data-lucide="sidebar"></i>
                </button>
                <div class="agent-info">
                    <span class="agent-name">Spreeuw - 0.2B</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" id="btn-share"><i data-lucide="share-2"></i></button>
                </div>
            </header>

            <div class="messages-viewport">
                <!-- Messages will be appended here -->
                <div class="message-wrapper assistant">
                    <div class="avatar ai-avatar"><video class="ai-video" src="starling.mp4" width="40" height="40" loop muted></video></div>
                    <div class="message-content">
                        <div class="message-box">
                            Hallo! Ik ben Spreeuw. Hoe kan ik je vandaag helpen?
                        </div>
                    </div>
                </div>
            </div>

            <footer class="chat-input-container">
                <form class="input-form">
                    <div class="input-wrapper">
                        <textarea placeholder="Typ een bericht..." rows="1" id="chat-input"></textarea>
                        <input type="file" id="file-input" style="display: none;" multiple>
                        <div class="input-actions">
                            <button type="submit" class="btn-send"><i data-lucide="arrow-up"></i></button>
                        </div>
                    </div>
                </form>
                <div class="input-footer-text">
                    Vertrouw deze AI onder <strong>geen</strong> enkele omstandigheid.
                </div>
            </footer>
        </main>
    </div>

    <script type="module" src="chat.js"></script>
</body>
</html>
